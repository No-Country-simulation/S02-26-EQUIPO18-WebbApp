# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/LLC_Incorporation
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration (Key must be at least 256 bits)
# This is a base64 encoded secret key: "mysecretkeymustbeatleast32characterslongformeetingrequirements"
security.jwt.secret-key=bXlzZWNyZXRrZXltdXN0YmVhdGxlYXN0MzJjaGFyYWN0ZXJzbG9uZ2Zvcm1lZXRpbmdyZXF1aXJlbWVudHM=
security.jwt.expiration-time=3600000

# Error Handling
server.error.include-message=always

#Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Stripe Keys
stripe.api.key=${STRIPE_API_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

#Meta Pixel
meta.pixel.id=${PIXEL_META_ID}
meta.access.token=${PIXEL_META_TOKEN}

# Pixel de google
google.measurement.id=${PIXEL_GOOGLE_MEASUREMENT_ID}
google.api.secret=${PIXEL_GOOGLE_API_SECRET}

