server.port=8080

# ---- postgresql ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:total_incorporation}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- jpa / hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- jwt ----
security.jwt.secret-key=${JWT_SECRET:bXlzZWNyZXRrZXltdXN0YmVhdGxlYXN0MzJjaGFyYWN0ZXJzbG9uZ2Zvcm1lZXRpbmdyZXF1aXJlbWVudHM=}
security.jwt.expiration-time=${JWT_EXPIRATION:3600000}

# ---- error handling ----
server.error.include-message=always

# ---- swagger ----
springdoc.swagger-ui.path=/swagger-ui.html

# ---- stripe ----
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# ---- meta pixel (server-side capi) ----
meta.pixel.id=${PIXEL_META_ID:}
meta.access.token=${PIXEL_META_TOKEN:}

# ---- google analytics (measurement protocol) ----
google.measurement.id=${PIXEL_GOOGLE_MEASUREMENT_ID:}
google.api.secret=${PIXEL_GOOGLE_API_SECRET:}

# ---- email (mailtrap para desarrollo) ----
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:e9def0f7105cb1}
spring.mail.password=${MAIL_PASSWORD:6e352fdaa6c6d0}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- cors / frontend url ----
app.frontend.url=${FRONTEND_URL:http://localhost:3000}