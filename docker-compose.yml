version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: total_incorporation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d total_incorporation"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build: ./Back
    container_name: spring_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: total_incorporation
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PIXEL_META_ID: ${PIXEL_META_ID}
      PIXEL_META_TOKEN: ${PIXEL_META_TOKEN}
      PIXEL_GOOGLE_MEASUREMENT_ID: ${PIXEL_GOOGLE_MEASUREMENT_ID}
      PIXEL_GOOGLE_API_SECRET: ${PIXEL_GOOGLE_API_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: 
      context: ./Front
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: next_frontend
    ports:
      - "3000:3000"
    environment:
      - JAVA_BACKEND_URL=http://backend:8080/api/v1/orders
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_started